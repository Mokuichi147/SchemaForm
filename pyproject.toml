[project]
name = "schemaform"
version = "1.2.0"
description = "フォーム作成・収集サービス"
readme = "README.md"
requires-python = ">=3.12.16"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "jsonschema>=4.26.0",
    "sqlalchemy>=2.1.6",
    "aiosqlite>=0.22.1",
    "tinydb>=4.9.0",
    "filelock>=4.2.5",
    "orjson>=3.13.0",
    "ulid-py>=1.1.0",
    "typer>=0.27.3",
    "httpx>=0.28.1",
    "user-permission>=0.7.0",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
]

[project.scripts]
schemaform = "schemaform.cli:cli"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
